<!DOCTYPE html>
<html>
<body>
<script>
const verifyImage = (url) => {
  return new Promise((resolve) => {
    const img = new window.Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
};
verifyImage("https://image.tmdb.org/t/p/w500/6WBeq4PNN67jRoYpzAbNdPSAOI.jpg").then(console.log);
</script>
</body>
</html>
